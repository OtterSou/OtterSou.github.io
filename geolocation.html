<!DOCTYPE html>
<html lang="en">

<head>
    <title>Geolocation / Speedometer</title>
    <style>
        body.dark {
            background-color: black;
            color: white;
        }
    </style>
</head>

<body>
    <h1>Geolocation / Speedometer</h1>
    <div>
        <button id="start-stop-btn" onclick="GPS.toggleActive();">Start</button>
        <button id="once-btn" onclick="GPS.once();">Once</button>
    </div>
    <p>
        <span id="latlon" style="white-space: pre-line;">Press a button above</span><br>
        <b>Speed:</b> <span id="speed"></span><br>
        <span id="alt1"></span> <span id="alt2"></span>
    </p>
    <p>
        <input type="checkbox" id="highacc-cb"><label for="highacc-cb">High accuracy</label><br>
        Units: <select id="speed-sel" onchange="GPS.updateDisplay();"></select>
        <select id="length-sel" onchange="GPS.updateDisplay();"></select><br>
        <input type="checkbox" id="ref-cb" onchange="GPS.updateDisplay();"><label for="ref-cb">Correct ellipsoidal height to altitude</label><br>
        <button onclick="toggleBackground();">Toggle background</button>
    </p>
    <p>
        Geoid height from EGM2008 by <a href="https://earth-info.nga.mil/">US National Geospatial-Intelligence
            Agency</a>
        (<a href="https://github.com/OtterSou/tile">converted to XYZ tiles</a>)<br>
    </p>
    <script src="./js/geolocation.js"></script>
</body>

</html>
